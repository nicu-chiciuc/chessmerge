# Deploys ChessMerge through samebase/convex-hosting's deploy action, which runs `pnpm run deploy`:
# a push to main deploys production, a pull request deploys the preview pr-<number>, and its close
# deletes that preview.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    # A pull request from a fork gets no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository || !github.head_ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.event.number || 'production' }}
      queue: max
    environment:
      name: ${{ github.head_ref && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # A closed pull request only deletes its preview. Without an install, the pnpm cache step
      # would fail to save a store that does not exist.
      - if: github.event.action != 'closed'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - id: deploy
        uses: samebase/convex-hosting/actions/deploy@6fb27501a0317547ef914cc78fd682020050aff4
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          preview-deploy-key: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
