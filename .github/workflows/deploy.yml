# Deploys ChessMerge through samebase/convex-hosting's deploy action, which runs `pnpm run deploy`:
# a push to main deploys production, a pull request deploys the preview named after the branch, and
# its close deletes that preview.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository || !github.head_ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy ${{ github.head_ref && format('preview/{0}', github.head_ref) || 'production' }}
      queue: max
    environment:
      name: ${{ github.head_ref && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
      deployment: ${{ github.event.action != 'closed' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # A closed pull request only deletes its preview. Without an install, the pnpm cache step
      # would fail to save a store that does not exist.
      - if: github.event.action != 'closed'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - id: deploy
        uses: samebase/convex-hosting/actions/deploy@v1
        with:
          deploy-key: ${{ secrets.CONVEX_DEPLOY_KEY }}
          preview-deploy-key: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
      - if: steps.deploy.outputs.preview-name
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            Preview `${{ steps.deploy.outputs.preview-name }}`: ${{ steps.deploy.outputs.url }}
            Deployment: ${{ steps.deploy.outputs.deployment-url }}
            Dashboard: ${{ steps.deploy.outputs.dashboard-url }}
      - if: github.event.action == 'closed'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          append: true
          only_update: true
          message: Preview deleted when the pull request closed.
