# Deploys with the shared workflow of samebase/samebase, pinned to a commit. A push to main deploys
# the stage `prod`, a pull request deploys `pr-<number>`, and closing it destroys that stage.
name: Alchemy
on:
  push: { branches: [main] }
  pull_request: { types: [opened, synchronize, reopened, closed] }
  workflow_dispatch: { inputs: { adopt: { type: boolean, default: false } } }
permissions: { contents: read, pull-requests: write }
jobs:
  alchemy:
    uses: samebase/samebase/.github/workflows/alchemy-deploy.yml@6f6e3f08d5f8e60098a1b45f5c7dac9dd092aa56
    with: { adopt: "${{ inputs.adopt == true }}" }
    secrets:
      CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
